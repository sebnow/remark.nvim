<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" viewBox="-8 -8 80 80" role="img" aria-label="remark.nvim">
  <style>
    .brk  { stroke: #98cb26; fill: #98cb26; }  /* dot fill; bracket fill removed by .line */
    .c1   { stroke: #7f32b9; }                 /* code lines (outer) */
    .c2   { stroke: #3fc3d9; }                 /* code line (middle) */
    .line { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- range bracket: one path, mirrored for the bottom tick -->
  <path id="tick" class="brk line" d="M 20,4 H 8 v 14"/>
  <use xlink:href="#tick" transform="matrix(1,0,0,-1,0,64)"/>
  <!-- the remark -->
  <circle class="brk" cx="8" cy="32" r="8"/>

  <!-- lines of code -->
  <path class="c1 line" d="M 22,18 H 60"/>
  <path class="c2 line" d="M 28,32 H 48"/>
  <path class="c1 line" d="M 28,46 H 60"/>
</svg>
